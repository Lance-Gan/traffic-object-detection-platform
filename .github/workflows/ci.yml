name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

jobs:
  backend:
    name: Backend

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: test
      LOG_LEVEL: WARNING
      SQL_ECHO: "false"

      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: traffic_detection_test
      DB_USER: traffic_test
      DB_PASSWORD: traffic_test_password

      MODEL_NAME: fake-yolo.pt
      INFERENCE_DEVICE: cpu

      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1

      UPLOAD_DIR: /tmp/traffic-test/uploads
      RESULT_DIR: /tmp/traffic-test/results

      VIDEO_UPLOAD_DIR: /tmp/traffic-test/uploads/videos
      VIDEO_RESULT_DIR: /tmp/traffic-test/results/videos

      CORS_ORIGINS: >-
        ["http://127.0.0.1:5173","http://localhost:5173"]

      ALLOWED_HOSTS: >-
        ["127.0.0.1","localhost","testserver"]

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: traffic_detection_test
          MYSQL_USER: traffic_test
          MYSQL_PASSWORD: traffic_test_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd
          "mysqladmin ping -h localhost -uroot -ptest_root_password --silent"

          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:8.4-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd
          "redis-cli ping"

          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7

        with:
          python-version: "3.13"

          cache: pip

          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check installed packages
        run: python -m pip check

      - name: Prepare test directories
        run: |
          mkdir -p /tmp/traffic-test/uploads/videos
          mkdir -p /tmp/traffic-test/results/videos

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Check migrations
        run: alembic check

      - name: Check formatting
        run: |
          ruff format --check app tests scripts

      - name: Lint backend
        run: |
          ruff check app tests scripts

      - name: Type-check backend
        run: |
          mypy app scripts

      - name: Run backend tests
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Audit Python dependencies
        run: pip-audit

  frontend:
    name: Frontend

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7

        with:
          node-version: "24"

          cache: npm

          cache-dependency-path: |
            frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

      - name: Check formatting
        run: npm run format:check

      - name: Audit npm dependencies
        run: |
          npm audit --audit-level=high

  browser-tests:
    name: Browser Tests

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7

        with:
          node-version: "24"

          cache: npm

          cache-dependency-path: |
            frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: |
          npx playwright install \
            --with-deps \
            chromium

      - name: Run browser tests
        run: npm run test:e2e