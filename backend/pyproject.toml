[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    ".venv",
    "migrations/versions",
]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "SIM",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = [
    "^migrations/",
]

[[tool.mypy.overrides]]
module = [
    "cv2",
    "cv2.*",
    "ultralytics",
    "ultralytics.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
markers = [
    "integration: tests requiring the MySQL test database",
    "websocket: tests covering WebSocket behaviour",
]

[tool.coverage.run]
branch = true
source = [
    "app",
]
omit = [
    "app/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2

[tool.coverage.xml]
output = "coverage.xml"