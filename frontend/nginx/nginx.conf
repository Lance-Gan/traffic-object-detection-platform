worker_processes auto;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    log_format main
        '$remote_addr - $request_id '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;

    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream api_backend {
        server backend:8000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 270m;

        add_header
            X-Content-Type-Options
            "nosniff"
            always;

        add_header
            X-Frame-Options
            "DENY"
            always;

        add_header
            Referrer-Policy
            "no-referrer"
            always;

        add_header
            Permissions-Policy
            "camera=(self), microphone=(), geolocation=()"
            always;

        add_header
            Cross-Origin-Opener-Policy
            "same-origin"
            always;

        add_header
            Content-Security-Policy
            "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
            always;

        location = /healthz {
            access_log off;

            add_header
                Content-Type
                "text/plain";

            return 200 "ok\n";
        }

        location = /index.html {
            add_header
                Cache-Control
                "no-store";

            try_files $uri =404;
        }

        location /assets/ {
            expires 1y;

            add_header
                Cache-Control
                "public, max-age=31536000, immutable";

            try_files $uri =404;
        }

        location /media/results/ {
            alias /srv/media/;

            autoindex off;
            expires 1h;

            add_header
                Cache-Control
                "private, max-age=3600";

            add_header
                X-Content-Type-Options
                "nosniff"
                always;
        }

        location /api/v1/camera/ {
            proxy_pass http://api_backend;

            proxy_http_version 1.1;

            proxy_set_header
                Host
                $host;

            proxy_set_header
                X-Real-IP
                $remote_addr;

            proxy_set_header
                X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header
                X-Forwarded-Proto
                $scheme;

            proxy_set_header
                X-Request-ID
                $request_id;

            proxy_set_header
                Upgrade
                $http_upgrade;

            proxy_set_header
                Connection
                $connection_upgrade;

            proxy_read_timeout 660s;
            proxy_send_timeout 660s;
            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://api_backend;

            proxy_http_version 1.1;

            proxy_set_header
                Host
                $host;

            proxy_set_header
                X-Real-IP
                $remote_addr;

            proxy_set_header
                X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header
                X-Forwarded-Proto
                $scheme;

            proxy_set_header
                X-Request-ID
                $request_id;

            proxy_set_header
                Connection
                "";

            proxy_connect_timeout 10s;
            proxy_read_timeout 330s;
            proxy_send_timeout 330s;

            proxy_request_buffering off;
        }

        location / {
            try_files
                $uri
                $uri/
                /index.html;
        }
    }
}